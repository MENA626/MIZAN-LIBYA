<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="MIZAN | ميزان — البنية التحتية الذكية لإدارة المنظومات القانونية">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6f9ff"/></linearGradient>
<filter id="blur" filterUnits="userSpaceOnUse" x="-800" y="-400" width="2800" height="1400"><feGaussianBlur stdDeviation="55"/></filter>
<radialGradient id="soft" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffffff" stop-opacity=".9"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0a3fa8" flood-opacity=".28"/></filter>
</defs>
<style>
text{font-family:"Cairo","Segoe UI",Tahoma,Arial,sans-serif}
.cloud{animation:cloud 22s linear infinite}
.c1{animation-delay:-4s}.c2{animation-delay:-13s;animation-duration:26s}.c3{animation-delay:-19s;animation-duration:30s}
@keyframes cloud{0%{transform:translate(-420px,0)}50%{transform:translate(800px,-30px)}100%{transform:translate(1620px,0)}}
.tile{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .8s cubic-bezier(.2,.9,.3,1.2) .1s forwards}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
.float{animation:float 5s ease-in-out 5s infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.base{transform-box:fill-box;transform-origin:center;transform:scaleX(0);animation:sx .55s ease-out .5s forwards}
.pillar{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:sy .6s ease-out .9s forwards}
.knob{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:sc .5s cubic-bezier(.2,.9,.3,1.4) 1.4s forwards}
.bar{transform-box:fill-box;transform-origin:center;transform:scaleX(0);animation:sx .55s ease-out 1.7s forwards}
.drop{opacity:0;animation:drop .6s cubic-bezier(.2,.9,.3,1.2) forwards}
.d1{animation-delay:2.1s}.d2{animation-delay:2.3s}
@keyframes sx{to{transform:scaleX(1)}}@keyframes sy{to{transform:scaleY(1)}}@keyframes sc{to{transform:scale(1)}}
@keyframes drop{from{opacity:0;transform:translateY(-90px)}to{opacity:1;transform:none}}
.beam{transform-origin:512px 275px;animation:beam 3.4s cubic-bezier(.45,.05,.3,1) 2.8s both}
.pl{animation:pl 3.4s cubic-bezier(.45,.05,.3,1) 2.8s both}
.pr{animation:pr 3.4s cubic-bezier(.45,.05,.3,1) 2.8s both}
@keyframes beam{0%{transform:rotate(-10deg)}20%{transform:rotate(8deg)}40%{transform:rotate(-4.5deg)}58%{transform:rotate(2.2deg)}76%{transform:rotate(-0.8deg)}90%{transform:rotate(0deg)}100%{transform:rotate(0deg)}}@keyframes pl{0%{transform:translateY(36.8px)}20%{transform:translateY(-29.5px)}40%{transform:translateY(16.6px)}58%{transform:translateY(-8.1px)}76%{transform:translateY(3.0px)}90%{transform:translateY(-0.0px)}100%{transform:translateY(-0.0px)}}@keyframes pr{0%{transform:translateY(-36.8px)}20%{transform:translateY(29.5px)}40%{transform:translateY(-16.6px)}58%{transform:translateY(8.1px)}76%{transform:translateY(-3.0px)}90%{transform:translateY(0.0px)}100%{transform:translateY(0.0px)}}
.ring{transform-box:fill-box;transform-origin:center;opacity:0;animation:ring 3s ease-out 6.2s infinite}
@keyframes ring{0%{opacity:.55;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
.fade{opacity:0;animation:fade .9s ease-out forwards}
.t1{animation-delay:1s}.t2{animation-delay:1.6s}.t3{animation-delay:2.4s}.t4{animation-delay:3.2s}
@keyframes fade{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.line{stroke-dasharray:440;stroke-dashoffset:440;animation:draw 1.4s ease-out 2s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
</style>
<rect width="1200" height="600" fill="url(#bg)"/>
<g filter="url(#blur)">
<ellipse class="cloud c1" cx="0" cy="170" rx="260" ry="120" fill="#0f6afd" fill-opacity=".38"/>
<ellipse class="cloud c2" cx="0" cy="430" rx="300" ry="110" fill="#3d8bff" fill-opacity=".30"/>
<ellipse class="cloud c3" cx="0" cy="300" rx="200" ry="95" fill="#0f6afd" fill-opacity=".24"/>
</g>
<g class="float">
<g class="tile"><rect x="470" y="30" width="260" height="260" rx="52" fill="#ffffff" fill-opacity=".92" stroke="#dbe7ff" stroke-width="2" filter="url(#sh)"/></g>
<g transform="translate(600,160) scale(.3) translate(-512,-494)">
<circle class="ring" cx="512" cy="275" r="72" fill="none" stroke="#0f6afd" stroke-width="6"/>
<rect class="base" x="270" y="732" width="486" height="56" rx="28" fill="#0f6afd"/>
<rect class="pillar" x="486" y="320" width="54" height="430" fill="#0f6afd"/>
<g class="beam"><rect class="bar" x="270" y="248" width="484" height="56" rx="28" fill="#0f6afd"/></g>
<circle class="knob" cx="512" cy="275" r="74" fill="#0f6afd"/>
<g class="pl"><g class="drop d1"><path d="M300 372 L204 548 L396 548 Z" fill="none" stroke="#0f6afd" stroke-width="44" stroke-linejoin="round"/>
<path d="M166 562 L434 562 A134 100 0 0 1 166 562 Z" fill="#0f6afd"/></g></g>
<g class="pr"><g class="drop d2"><path d="M724 372 L628 548 L820 548 Z" fill="none" stroke="#0f6afd" stroke-width="44" stroke-linejoin="round"/>
<path d="M590 562 L858 562 A134 100 0 0 1 590 562 Z" fill="#0f6afd"/></g></g>
</g>
</g>
<g text-anchor="middle">
<text class="fade t1" x="600" y="385" fill="#0b1f4d" font-size="84" font-weight="800" direction="rtl">ميـــــزان</text>
<text class="fade t2" x="600" y="438" fill="#0f6afd" font-size="34" font-weight="800" letter-spacing="16">MIZAN</text>
<line class="line" x1="390" y1="462" x2="810" y2="462" stroke="#0f6afd" stroke-width="3" stroke-linecap="round"/>
<text class="fade t3" x="600" y="505" fill="#0b1f4d" font-size="26" font-weight="700" direction="rtl">البنية التحتية الذكية لإدارة المنظومات القانونية</text>
<g class="fade t4"><rect x="350" y="527" width="500" height="40" rx="20" fill="#0b1f4d" fill-opacity=".9"/>
<text x="600" y="553" fill="#ffffff" font-size="14" font-weight="700" letter-spacing="2">SMART LEGAL INFRASTRUCTURE · AI · RAG</text></g>
</g>
</svg>