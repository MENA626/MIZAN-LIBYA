<style>
text{font-family:"Cairo","Segoe UI",Tahoma,Arial,sans-serif}
.cloud{animation:cloud 24s linear infinite}.c2{animation-delay:-12s;animation-duration:28s}
@keyframes cloud{0%{transform:translate(-420px,0)}100%{transform:translate(1620px,0)}}
.pop{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .7s cubic-bezier(.2,.9,.3,1.25) forwards}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.85)}to{opacity:1;transform:none}}
.a0{animation-delay:.1s}.a1{animation-delay:.4s}.a2{animation-delay:.7s}.a3{animation-delay:1s}.a4{animation-delay:1.3s}.a5{animation-delay:1.6s}.a6{animation-delay:1.9s}.a7{animation-delay:2.2s}.a8{animation-delay:2.5s}
.flow{stroke-dasharray:10 14;animation:flow 1s linear infinite;opacity:.9}
@keyframes flow{to{stroke-dashoffset:-24}}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
.r2{animation-delay:1.2s}
@keyframes ring{0%{opacity:.5;transform:scale(1)}100%{opacity:0;transform:scale(1.7)}}
.hub{transform-box:fill-box;transform-origin:center;animation:beat 2.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.06)}24%{transform:scale(1)}}
.hubbeam{transform-origin:512px 275px;animation:sway 4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.bar{transform-box:fill-box;transform-origin:bottom;animation:grow 3.2s ease-in-out infinite}
.b1{animation-delay:.2s}.b2{animation-delay:.4s}.b3{animation-delay:.6s}
@keyframes grow{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}
.glow{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.25}50%{opacity:1}}
.title{opacity:0;animation:fade .8s ease-out forwards}
@keyframes fade{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
.paths{opacity:0;animation:fadein 1s ease-out 1.2s forwards}.movers{opacity:0;animation:fadein .6s ease-out 2.6s forwards}
@keyframes fadein{to{opacity:1}}
</style>
